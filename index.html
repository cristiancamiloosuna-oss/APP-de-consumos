<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolsillo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b6646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolsillo">
<meta name="description" content="Tus gastos, tu presupuesto y los descuentos de tus tarjetas.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday money tool, warm and calm, built like a shipped phone app
   IDEA a pocket budget: a wallet of cards, a budget ring, receipts arriving from bank notifications
   PICTURE the live budget ring and the card wallet, drawn from the person's own numbers
   COLOUR apricot ground, deep money green, red for spending, one line colour per category
   TYPE Figtree 800 for figures, Figtree for text
   LAYOUT one phone column up to 480px with a bottom tab bar; on a laptop the column sits centred */
:root{color-scheme:light dark;--bg:light-dark(#f4f4f5,#0e0e10);--card:light-dark(#ffffff,#1a1a1d);--soft:light-dark(#f4f4f6,#242428);--ink:light-dark(#111113,#f4f4f5);--mute:light-dark(#71717a,#a1a1aa);--line:light-dark(#e9e9ec,#2c2c31);--green:light-dark(#15803d,#4ade80);--btn:light-dark(#18181b,#3a3a40);--band:light-dark(#18181b,#1a1a1d);--red:light-dark(#e11d48,#fb7185);--fab:#ef4444;--amber:light-dark(#a16207,#facc15);--amberbg:light-dark(#fef6dc,#33290f);--okbg:light-dark(#e7f7ec,#11291a);--sh:0 1px 2px rgb(0 0 0/.04),0 6px 18px rgb(0 0 0/.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chips input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,p{margin:0}
.i{flex:none;display:block}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;min-height:60px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;color:inherit}
.ib:hover{background:color-mix(in srgb,currentColor 8%,transparent)}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amberbg);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.demo span{flex:1 1 180px}
.demo button{font-weight:700;color:var(--amber);min-height:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.h3row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.h3row h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.h3row span{color:var(--mute);font-size:14px}
.link{color:var(--green);font-weight:700;font-size:15px;min-height:36px}
.mute{color:var(--mute)}
.small{font-size:14px}
.pos{color:var(--green)}
.neg{color:var(--red)}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.hero{text-align:center;padding:6px 0 18px}
.hero .lbl{color:var(--mute);font-weight:600}
.big{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.hero .sub{color:var(--mute);font-size:14px;margin-top:4px}
.wallet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.acc{--c:#15704a;position:relative;overflow:hidden;aspect-ratio:1.55;border-radius:18px;padding:12px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 105% 120%,rgb(255 255 255/.22) 0 34%,transparent 35%),radial-gradient(circle at 85% -30%,rgb(255 255 255/.14) 0 40%,transparent 41%),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 52%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.acct{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipg{width:26px;height:19px;border-radius:5px;background:linear-gradient(135deg,#f7dc8a,#c99a2e);opacity:.9}
.acck{font-size:13px;opacity:.88}
.accb{font-weight:800;font-size:16px;white-space:nowrap}
.addacc{aspect-ratio:1.55;border-radius:18px;border:2px dashed var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--mute);font-weight:600;font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div{background:var(--soft);border-radius:14px;padding:10px}
.trio span{display:block;font-size:13px;color:var(--mute);line-height:1.2;margin-bottom:2px}
.trio b{font-size:16px;white-space:nowrap}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.ico{--c:#64748b;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.txm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txm small{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.txm em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:13px;font-weight:700;border-radius:8px;padding:2px 7px;margin-top:4px}
.ok{background:var(--okbg);color:var(--green)}
.warn{background:var(--amberbg);color:var(--amber)}
.txa{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.day{font-size:14px;font-weight:700;color:var(--mute);margin:14px 0 2px}
.nt{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-size:15px}
.mbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:12px}
.mbar b{font-size:20px;font-weight:800;text-align:center;white-space:nowrap}
.mbar button{min-height:40px;color:var(--mute);font-weight:600;font-size:15px;white-space:nowrap}
.mbar button:first-child{text-align:left}.mbar button:last-child{text-align:right}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button,.seg label{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:15px;color:var(--mute);display:grid;place-items:center;text-align:center;cursor:pointer;padding:0 6px}
.seg .on,.seg input:checked+span{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label span{display:grid;place-items:center;width:100%;height:100%;border-radius:10px;min-height:40px}
.seg label{padding:0}
.band{margin:0;padding:0}
.lift{position:relative}
.donut{display:grid;place-items:center;position:relative;margin:4px auto 10px;width:min(230px,70vw);aspect-ratio:1}
.donut svg{width:100%;height:100%}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr b{font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.donut .ctr small{color:var(--mute);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.split span{display:block;font-size:13px;color:var(--mute)}
.split b{font-size:18px;white-space:nowrap}
.split div:last-child{text-align:right}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);gap:3px}
.sbar i{display:block;height:100%;border-radius:6px}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type,.h3row+.lrow,.h3row+.tx{border-top:0}
.lrow b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{display:block;color:var(--mute);font-size:13px}
.lrow .r{text-align:right;white-space:nowrap}
.lrow .r b{font-variant-numeric:tabular-nums}
.meter{display:block;height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--c,var(--green))}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin-top:6px;border-radius:14px;background:var(--soft);font-weight:700;color:var(--ink)}
.fig{position:relative;min-height:120px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.fig text.m{fill:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:13px;color:var(--mute);font-weight:700;padding:4px 0}
.cd{min-height:58px;border-radius:12px;background:var(--soft);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700}
.cd.out{visibility:hidden}
.cd.today{outline:2px solid var(--green)}
.cd.sel{background:var(--btn);color:#fff}
.cd small{font-size:13px;letter-spacing:-.02em;font-weight:600;color:var(--mute);white-space:nowrap}
.cd.sel small{color:#fff}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:190px;padding-top:24px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars i{display:block;width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--red) 35%,var(--soft))}
.bars .cur i{background:var(--red)}
.bars span{font-size:13px;color:var(--mute);white-space:nowrap}
.bars em{font-style:normal;font-size:13px;font-weight:700;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar i{display:block;height:14px;border-radius:7px;background:var(--c)}
.hbar b{white-space:nowrap;font-variant-numeric:tabular-nums}
.find{font-size:clamp(22px,6vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px;text-wrap:balance}
.goal{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;margin-bottom:14px;background:radial-gradient(circle at 100% 0,rgb(255 255 255/.2) 0 30%,transparent 31%),linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 45%,#000))}
.goal .gi{position:absolute;right:-18px;top:-10px;opacity:.18}
.goal h3{font-size:19px;font-weight:700;position:relative}
.goal .gt{font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;position:relative}
.goal p{position:relative;opacity:.9;font-size:14px}
.goal .gp{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:14px;line-height:1}
.gbar{height:12px;border-radius:6px;background:rgb(255 255 255/.25);margin:10px 0 12px;overflow:hidden;position:relative}
.gbar i{display:block;height:100%;background:#ffd34d;border-radius:6px}
.gbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.gbox div{background:rgb(0 0 0/.22);border-radius:14px;padding:8px 10px}
.gbox span{display:block;font-size:13px;opacity:.85}
.gbox b{white-space:nowrap}
.gact{display:flex;gap:8px;margin-top:12px;position:relative}
.gact button{flex:1;min-height:44px;border-radius:12px;background:rgb(255 255 255/.18);color:#fff;font-weight:700}
.gact button:first-child{background:#fff;color:#1f1812}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--b,var(--btn));color:#fff;font-weight:800;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn+.btn{margin-top:8px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:5}
.fab button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;box-shadow:0 8px 20px rgb(0 0 0/.22)}
.fab button.alt{width:48px;height:48px;background:var(--card);color:var(--ink);border:1px solid var(--line);justify-self:end;margin-left:auto}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;color:var(--mute);text-decoration:none;font-size:13px;font-weight:600;position:relative}
.nav a.on{color:var(--green)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red)}
#ov{position:fixed;inset:0;background:rgb(20 10 5/.45);z-index:20}
#sh{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(480px,100%);max-height:92%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;z-index:21;transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#sh.in{transform:translate(-50%,0)}
.shh{display:flex;align-items:center;gap:8px;padding:14px 12px 4px 20px;position:sticky;top:0;background:var(--card);z-index:1}
.shh h2{flex:1;font-size:20px;font-weight:800;letter-spacing:-.01em}
.shb{padding:6px 20px 24px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:14px;font-weight:700;color:var(--mute);margin-bottom:6px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--soft);font-size:16px}
textarea.inp{padding:10px 12px;min-height:96px;resize:vertical;line-height:1.4}
.inp.xl{font-size:30px;font-weight:800;min-height:64px;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:15px;color:color-mix(in srgb,var(--c,var(--ink)) 70%,var(--ink))}
.chips input:checked+span{background:var(--c,var(--btn));border-color:transparent;color:#fff}
.chips.days span{min-width:44px;justify-content:center;padding:0 8px}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw div{flex:1}
.sw b{display:block;font-weight:700}
.sw small{display:block;color:var(--mute);font-size:13px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .2s}
.sw input:checked{background:var(--green)}
.sw input:checked::after{transform:translateX(20px)}
.feat{display:grid;grid-template-columns:48px minmax(0,1fr) 24px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--band);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}
.feat .ico{background:rgb(255 255 255/.16);color:#fff;width:48px;height:48px}
.feat b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.feat small{display:block;opacity:.85;font-size:14px;margin-top:2px}
.sum{background:var(--band);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px}
.sum p{opacity:.85;font-size:14px}
.sum .big{color:#fff;opacity:1;font-size:clamp(34px,10vw,46px);margin:2px 0}
.sum .miss{display:flex;gap:8px;align-items:center;margin-top:10px;background:rgb(0 0 0/.2);border-radius:12px;padding:8px 10px;font-size:14px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.rule b{display:block;font-weight:700}
.rule small{display:block;color:var(--mute);font-size:13px}
.ch{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.ch .sq{width:34px;height:24px;border-radius:6px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));flex:none}
.ch b{flex:1;font-weight:800}
.np{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--soft);margin-top:12px}
.np dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0 0 10px;font-size:15px}
.np dt{color:var(--mute)}
.np dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.tip{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.tip .i{margin-top:1px}
.samples{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:10px;scroll-snap-type:x mandatory}
.samples button{flex:none;scroll-snap-align:start;max-width:240px;text-align:left;font-size:13px;line-height:1.3;border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card);color:var(--mute)}
.samples b{display:block;color:var(--ink);font-size:14px}
.rec{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec.best{background:var(--okbg);border-radius:14px;padding:10px;border:0}
.rec .sq{width:34px;height:24px;border-radius:6px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}
.rec small{display:block;color:var(--mute);font-size:13px}
.hoy{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.hoy div{flex:none;scroll-snap-align:start;width:min(220px,62vw);border-radius:16px;padding:12px;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}
.hoy b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hoy span{display:block;font-size:14px;opacity:.92}
.tpl{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.tpl:first-child{border-top:0}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch label{cursor:pointer}
.swatch input{position:absolute;opacity:0}
.swatch span{display:block;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatch input:checked+span{border-color:var(--ink)}
.swatch input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}

function effect(t,sign){const a=acc(t.acc);if(!a)return;const v=t.amount*sign;if(t.kind==='t'){const b=acc(t.to);if(a.type==='cre')a.bal+=v;else a.bal-=v;if(b){if(b.type==='cre')b.bal-=v;else b.bal+=v}return}const out=t.kind==='g';if(a.type==='cre')a.bal+=out?v:-v;else a.bal+=out?-v:v}

function ruleMatch(r,t){if(t.kind!=='g')return false;const wd=wdOf(t.date);if(r.days&&r.days.length&&!r.days.includes(wd))return false;if(r.min&&t.amount<r.min)return false;if(r.scope==='cat')return t.cat===r.cat;if(r.scope==='com')return !!r.com&&norm(t.merchant).includes(norm(r.com));return true}
function computeDisc(){const used={},out={};const list=S.txs.filter(t=>t.kind==='g').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const left=(r,m)=>r.cap?Math.max(0,r.cap-(used[r.id+'|'+m]||0)):Infinity;
 for(const t of list){const m=ymOf(t.date);let best=null,alt=null;
  for(const r of S.rules){if(!acc(r.acc)||!ruleMatch(r,t))continue;const v=Math.min(t.amount*r.pct/100,left(r,m));if(r.acc===t.acc){if(!best||v>best.v)best={r,v}}else if(!alt||v>alt.v)alt={r,v}}
  const saved=best?Math.round(best.v):0;if(saved>0)used[best.r.id+'|'+m]=(used[best.r.id+'|'+m]||0)+saved;
  const miss=alt&&alt.v-saved>=1000?{amt:Math.round(alt.v-saved),r:alt.r}:null;
  out[t.id]={saved,rule:saved>0?best.r:null,miss}}
 return{out,used}}
let dC=null,dV=-1;const disc=()=>{if(dV!==ver){dC=computeDisc();dV=ver}return dC};
function sums(m){const D=disc();let inc=0,exp=0,sav=0,mis=0;for(const t of txsOf(m)){if(t.kind==='i')inc+=t.amount;else if(t.kind==='g'){exp+=t.amount;const d=D.out[t.id];if(d){sav+=d.saved;if(d.miss)mis+=d.miss.amt}}}return{inc,exp,sav,mis}}
function spentBy(m){const o={};for(const t of txsOf(m))if(t.kind==='g')o[t.cat]=(o[t.cat]||0)+t.amount;return o}
function daysTxt(days){if(!days||!days.length||days.length===7)return'todos los días';const n=WEEK.filter(d=>days.includes(d)).map(d=>DIA3[d]);return n.length===1?'los '+DIA[days[0]]+(/s$/.test(DIA[days[0]])?'':'s'):n.slice(0,-1).join(', ')+' y '+n[n.length-1]}
function scopeTxt(r){return r.scope==='cat'?cat(r.cat).name:r.scope==='com'?'“'+String(r.com).toUpperCase()+'”':'todas las compras'}
function ruleTxt(r){return `${r.pct}% ${r.kind==='cash'?'de cashback ':''}en ${scopeTxt(r)}`}

  for(const [k,v] of Object.entries(docs)){if(v===null){await col.doc(k).delete();delete cloudSaved[k];continue}const js=JSON.stringify(v);if(cloudSaved[k]===js)continue;await col.doc(k).set(JSON.parse(js));cloudSaved[k]=js}}

function parseNotif(text){
 const raw=String(text||'').trim();const n=norm(raw);if(!raw)return null;
 const am=raw.match(/(?:\$|cop\s?)\s?(\d[\d.,]*)/i);if(!am)return{raw,error:'No encontré un monto con $ en el texto.'};
 let s=am[1].replace(/[.,]$/,'');s=s.replace(/[.,]\d{1,2}$/,'');const amount=Number(s.replace(/[.,]/g,''));if(!amount)return{raw,error:'El monto no se pudo leer.'};
 const head=n.slice(0,40);let bank='';for(const [k,v] of BANKS)if(head.includes(k)){bank=v;break}
 if(!bank&&/^nu\b|\bnu:|tarjeta nu\b|\btu nu\b/.test(n))bank='Nu';
 const after=raw.slice(am.index+am[0].length);
 const mm=after.match(/\b(?:en|a(?!\s+las))\s+(.+?)(?=\s+(?:con\b|el\b|a\s+las\b|desde\b|por\b|tarjeta\b|t\.?\s?cred|t\.?\s?deb|tc\b|td\b|cta\b|cuenta\b|\d{1,2}:\d{2}|\d{1,2}\/\d{1,2})|[.,;](?:\s|$)|$)/i);
 let merchant=mm?mm[1].trim().replace(/[*\s]+$/,'').slice(0,42):'';
 if(/^(cajero|atm)/i.test(merchant))merchant=merchant.toUpperCase();
 const lm=raw.match(/(?:\*+|terminad[ao] en|termina en|final(?:izada)? en|x{2,}|\b(?:tc|td|t\.?\s?cred|t\.?\s?deb|tarjeta|cta|cuenta)\s*(?:no\.?\s*)?\**)\s?(\d{4})\b/i);
 const last4=lm?lm[1]:'';
 let kind='g';if(/\b(recibiste|te (envio|envió|enviaron|transfirio|transfirieron)|abono|consignacion|deposito|nomina|pago de nomina|ingreso)\b/.test(n))kind='i';else if(/\bretir/.test(n))kind='t';
 const dm=raw.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);let date=todayStr();if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];const cand=`${y}-${pad(dm[2])}-${pad(dm[1])}`;if(!isNaN(new Date(cand+'T12:00')))date=cand}
 const tm=raw.match(/\b(\d{1,2}):(\d{2})\b/);const time=tm?pad(tm[1])+':'+tm[2]:nowTime();
 if(!merchant&&kind==='i'){const fm=after.match(/\bde\s+(.+?)(?=[.,;]|\s+(?:el|a las|en)\b|$)/i);merchant=fm?fm[1].trim().slice(0,42):'Ingreso'}
 let a=null;if(last4)a=S.accs.find(x=>x.last4===last4);
 if(!a&&bank){const cands=S.accs.filter(x=>norm(x.name).includes(norm(bank))||norm(bank).includes(norm(x.name)));const wantCre=/cred|\btc\b/.test(n);a=cands.find(x=>(x.type==='cre')===wantCre)||cands[0]}
 return{raw,amount,merchant:merchant||'Compra',last4,bank,kind,date,time,acc:a?a.id:'',cat:kind==='g'?guessCat(merchant):''}}
function mkey(m){return norm(m).replace(/[^a-z0-9 ]/g,' ').trim().split(/\s+/)[0]||''}
function guessCat(m){const k=mkey(m);if(k&&S.learn[k])return S.learn[k];const n=norm(m);for(const [kw,c] of KWL){if(new RegExp('(^|[^a-z0-9])'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n))return c}return 'otr'}

 save()}

 return topbar(S.name?'Hola, '+S.name:'Bolsillo')+demoBar()+`<section class="hm"><p class="lbl"><button data-a="mon" data-d="-1" aria-label="Mes anterior">‹</button>Gastado en ${MES[+M.slice(5)-1]}${isCur?'':' '+M.slice(0,4)}<button data-a="mon" data-d="1" aria-label="Mes siguiente">›</button></p><p class="hbig">${money(s.exp)}<small>COP</small></p><div class="pills">${left>=0?`<span class="pill dark">Quedan ${money(left)}</span>`:`<span class="pill bad">Te pasaste ${money(-left)}</span>`}<span class="pill">de ${money(plan)}</span>${s.sav?`<span class="pill ok">${ic('percent',13)}${money(s.sav)} en descuentos</span>`:''}</div></section>

 <div class="fab"><div class="row"><button class="alt" data-a="notifSheet" aria-label="Pegar notificación del banco">${ic('clip',22)}</button><button class="alt" data-a="txEdit" aria-label="Agregar gasto">${ic('plus',24)}</button></div><button class="mic" data-a="voice" aria-label="Dictar un gasto"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>`}
function voiceAdd(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){push('Aquí no hay dictado','Escribe el gasto con el +.','warn');txSheet();return}
 let r;try{r=new SR()}catch(e){txSheet();return}r.lang='es-CO';r.interimResults=false;r.maxAlternatives=1;push('Te escucho…','Di por ejemplo: “almuerzo veinticinco mil”.');
 r.onresult=e=>{const t=e.results[0][0].transcript;txSheet(null,parseSpoken(t))};r.onerror=ev=>{push(ev.error==='not-allowed'?'Sin permiso de micrófono':'No te entendí',ev.error==='not-allowed'?'Dale permiso al micrófono en Chrome.':'Intenta otra vez o escribe el gasto.','warn')};try{r.start()}catch(e){txSheet()}}
function parseSpoken(t){let s=' '+String(t).toLowerCase()+' ';let amount=0;const m=s.match(/(\d[\d.,]*)\s*(mil|k|lucas|millones|millón|millon)?/);
 if(m){const raw=m[1].replace(/[.,](?=\d{3}(\D|$))/g,'').replace(',','.');const mul=m[2]?(/mill/.test(m[2])?1e6:1e3):1;amount=Math.round(parseFloat(raw)*mul)||0;s=s.replace(m[0],' ')}
 else if(/\bmil\b/.test(s)){amount=1000;s=s.replace(/\bmil\b/,' ')}
 s=s.replace(/\b(pesos|de|en|por|un|una|gasto|gasté|gaste)\b/g,' ').replace(/\s+/g,' ').trim();return{amount,merchant:s?s[0].toUpperCase()+s.slice(1):'',cat:guessCat(s)}}

function renderMovList(){const el=$('#movlist');if(!el)return;const D=disc();const q=norm(movQ);

function donutSvg(segs,total){const r=78,C=2*Math.PI*r;let off=0;const gap=segs.length>1?2.5:0;return `<svg viewBox="0 0 200 200" role="img" aria-label="Distribución del presupuesto"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--soft)" stroke-width="24"/>${segs.map(s=>{const len=Math.max(0,s.v/total*C-gap);const el=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${s.c}" stroke-width="24" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=s.v/total*C;return el}).join('')}</svg>`}

  <section class="card"><div class="h3row"><h3>Pagos fijos</h3><span>${S.bills.length}</span></div>${[...S.bills].sort((a,b)=>a.day-b.day).map(b=>`<button class="lrow" data-a="billEdit" data-id="${esc(b.id)}"><span class="ico" style="--c:${cat(b.cat).color}">${cIc(cat(b.cat))}</span><span><b>${esc(b.name)}</b><small>Cada mes, el día ${b.day}</small></span><span class="r"><b>${money(b.amount)}</b></span></button>`).join('')||'<p class="empty small">Agrega arriendo, servicios o suscripciones para verlos en el calendario.</p>'}<button class="addrow" data-a="billEdit">${ic('plus',18)}Agregar pago fijo</button></section>
  <section class="card"><div class="h3row"><h3>A dónde va tu dinero</h3><span>de ${money(inc)}</span></div><div class="fig" id="sankey"><svg></svg></div></section>`}
 else if(presTab==='seg'){const sp=spentBy(M),s=sums(M);const isCur=M===curYm();const [y,mo]=M.split('-').map(Number);const dim=new Date(y,mo,0).getDate();const left=isCur?dim-new Date().getDate()+1:0;const restPlan=Math.max(0,plan-s.exp);

function drawSankey(){const box=$('#sankey');if(!box)return;const svg=box.querySelector('svg');const inc=incTotal(),plan=planTotal(),sv=inc-plan;
 const items=S.cats.filter(c=>c.budget>0).sort((a,b)=>b.budget-a.budget).map(c=>({n:c.name,v:c.budget,c:c.color}));if(sv>0)items.push({n:'Ahorro',v:sv,c:'var(--green)'});
 if(!items.length){box.style.height='48px';svg.innerHTML=`<text class="m" x="0" y="28">Pon presupuestos para ver el reparto.</text>`;return}
 const W=box.clientWidth,row=32,H=items.length*row+8;box.style.height=H+'px';const tot=sum(items,i=>i.v)||1;const xr=Math.round(W*0.4),lw=14;let y=4;
 let out='';items.forEach((it,i)=>{const h=Math.max(2,it.v/tot*(H-8)),cy=4+i*row+row/2,hr=Math.min(row-8,Math.max(4,h)),y0=y,y1=y+h,r0=cy-hr/2,r1=cy+hr/2,mx=lw+(xr-lw)/2;
  out+=`<path d="M${lw} ${y0}C${mx} ${y0} ${mx} ${r0} ${xr} ${r0}L${xr} ${r1}C${mx} ${r1} ${mx} ${y1} ${lw} ${y1}Z" fill="${it.c}" fill-opacity=".28"/><rect x="0" y="${y0}" width="${lw}" height="${h}" fill="${it.c}"/><rect x="${xr}" y="${r0}" width="8" height="${hr}" rx="2" fill="${it.c}"/><text x="${xr+16}" y="${cy+5}">${esc(it.n)}</text><text class="m" x="${W}" y="${cy+5}" text-anchor="end">${W<400?kshort(it.v):money(it.v)}</text>`;y=y1});
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=out}

 const sp=spentBy(M);const cats=Object.entries(sp).sort((a,b)=>b[1]-a[1]);const cmx=Math.max(1,...cats.map(c=>c[1]));

 ${S.inbox.length?`<section class="card"><div class="h3row"><h3>Bandeja por confirmar</h3><span>${S.inbox.length}</span></div>${S.inbox.map((p,i)=>`<div class="lrow"><span class="ico" style="--c:#a86e00">${ic('bell')}</span><span><b>${esc(p.merchant)}</b><small>${esc(acc(p.acc)?.name||'Sin cuenta')} · ${esc(p.date)}</small></span><span class="r"><b>${money(p.amount)}</b><small><button class="link" data-a="inboxOk" data-i="${i}">Registrar</button> · <button class="link" style="color:var(--red)" data-a="inboxNo" data-i="${i}">Descartar</button></small></span></div>`).join('')}</section>`:''}

function renderRec(){const el=$('#recres');if(!el)return;const c=$('#rc-cat').value,amt=readMoney($('#rc-amt')),com=$('#rc-com').value.trim();const D=disc(),m=curYm(),d=todayStr();
 const t={kind:'g',date:d,amount:amt,cat:c,merchant:com};const cards=S.accs.filter(a=>a.type!=='efe');
 const res=cards.map(a=>{let best=null;for(const r of S.rules){if(r.acc!==a.id||!ruleMatch(r,t))continue;const left=r.cap?Math.max(0,r.cap-(D.used[r.id+'|'+m]||0)):Infinity;const v=Math.round(Math.min(amt*r.pct/100,left));if(!best||v>best.v)best={r,v}}return{a,best}}).sort((x,y)=>(y.best?.v||0)-(x.best?.v||0));
 if(!amt){el.innerHTML='<p class="mute small">Escribe el monto.</p>';return}
 el.innerHTML=res.map((x,i)=>`<div class="rec ${i===0&&x.best&&x.best.v>0?'best':''}"><span class="sq" style="--c:${esc(x.a.color)}"></span><span><b>${esc(x.a.name)}</b><small>${x.best&&x.best.v>0?esc(ruleTxt(x.best.r)):x.best?'Llegaste al tope de este mes':'Sin descuento hoy para esto'}</small></span><b class="money ${x.best&&x.best.v>0?'pos':'mute'}">${x.best&&x.best.v>0?'−'+money(x.best.v):'$0'}</b></div>`).join('')||'<p class="mute small">Agrega tarjetas para comparar.</p>'}

function previewN(p){const el=$('#npv');if(!el)return;if(!p){el.innerHTML='';return}if(p.error){el.innerHTML=`<div class="np"><p class="neg"><b>${esc(p.error)}</b></p><p class="small mute">Copia el texto completo de la notificación, con el valor.</p></div>`;return}
 const D=disc(),m=curYm();const t={kind:p.kind,date:p.date,amount:p.amount,cat:p.cat,merchant:p.merchant,acc:p.acc};let tip='';
 if(p.kind==='g'){let best=null,alt=null;for(const r of S.rules){if(!acc(r.acc)||!ruleMatch(r,t))continue;const left=r.cap?Math.max(0,r.cap-(D.used[r.id+'|'+m]||0)):Infinity;const v=Math.round(Math.min(p.amount*r.pct/100,left));if(r.acc===p.acc){if(!best||v>best.v)best={r,v}}else if(!alt||v>alt.v)alt={r,v}}

let deferredPrompt=null;

 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

 handleIntake()}
function handleIntake(){let q;try{q=new URLSearchParams(location.search)}catch(e){return}const mo=(q.get('monto')||'').trim();if(mo){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}const tj=(q.get('tarjeta')||'').trim(),co=(q.get('comercio')||'').trim();const d=mo.replace(/[^\d.,]/g,'');intake(`${tj?tj+': ':''}Compra por $${d} en ${co||'COMPRA'}.`);return}const nota=(q.get('nota')||'').trim(),t=(q.get('t')||'').trim();if(!nota&&!t)return;
 try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
 if(/^\{.*\}$/.test(nota)){push('MacroDroid no mandó el texto','Revisa en la macro lo que va entre llaves: ponlo con el botón …','warn');return}
 const tt=/^\{.*\}$/.test(t)?'':t;intake(tt&&!norm(nota).includes(norm(tt))?tt+': '+nota:nota||tt)}
function intake(text){if(!text)return;if(!S.cfg.capture){push('Llegó una notificación del banco','La lectura está apagada en Descuentos.','warn');return}
 const p=parseNotif(text);if(!p||p.error)return;
 const k=norm(p.raw).replace(/\s+/g,' '),now=Date.now();S.flags.seen=(S.flags.seen||[]).filter(x=>now-x.t<6e5);if(S.flags.seen.some(x=>x.k===k))return;S.flags.seen.push({k,t:now});
 M=ymOf(p.date);if(S.cfg.auto&&p.acc)registerParsed(p);else{S.inbox.push(p);save();push('Notificación por confirmar',`${money(p.amount)} en ${p.merchant}. Revísala en Descuentos.`)}
 go('inicio')}

let OB=null;
function startOb(keep){const d=emptyState();if(keep){const cl=x=>JSON.parse(JSON.stringify(x));d.accs=cl(S.accs);d.cats=cl(S.cats);if(S.incomes[0])d.incomes=[cl(S.incomes[0])];ONB.forEach(id=>{if(!d.cats.some(c=>c.id===id))d.cats.push({...CAT_DEF.find(c=>c.id===id),budget:0})})}OB={d,keep:!!keep,step:0,val:keep&&d.incomes[0].amount?String(d.incomes[0].amount):'',phase:'amt',steps:['salary','payday',...ONB.map(i=>'cat:'+i),'summary','cards']};$('#ob').hidden=false;renderOb()}
function ringSvg(f,c){const r=88,C=2*Math.PI*r,len=Math.max(0,Math.min(1,f))*C;return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="100" cy="100" r="${r}" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 100 100)"/></svg>`}
const keypad=()=>`<div class="kp">${['1','2','3','4','5','6','7','8','9','000','0','del'].map(k=>`<button data-a="key" data-k="${k}" aria-label="${k==='del'?'Borrar':k}">${k==='del'?ic('del',24).replace('class="i"','class="i" style="margin:auto"'):k}</button>`).join('')}</div>`;
function renderOb(){const d=OB.d,st=OB.steps[OB.step],inc=d.incomes[0].amount;
 const top=`<div class="obtop"><button class="ib" data-a="obBack" aria-label="Atrás">${ic('left',22)}</button><div class="obicons">${ONB.map(id=>{const c=d.cats.find(x=>x.id===id);return `<span class="obi ${c.budget>0?'done':''} ${st==='cat:'+id?'cur':''}" style="--c:${c.color}">${cIc(c,16)}</span>`}).join('')}</div><button class="ib" data-a="obClose" aria-label="Cerrar">${ic('x',22)}</button></div>`;
 let b='';const v=Number(OB.val||0);
 if(st==='salary')b=`<h2 class="obh">Para empezar, ingresa tu salario</h2><div class="obring">${ringSvg(v?1:0,'var(--green)')}<b>${money(v)}</b></div><p class="obn">Lo que te entra al mes. Podrás cambiarlo después.</p><button class="btn" data-a="obNext" ${v?'':'disabled'}>Siguiente</button>${keypad()}`;
 else if(st==='payday')b=`<h2 class="obh">¿Qué día del mes te pagan?</h2><p class="obn">${money(inc)} cada mes</p><div class="dgrid">${Array.from({length:31},(_,i)=>`<button class="${d.incomes[0].day===i+1?'on':''}" data-a="obDay" data-d="${i+1}">${i+1}</button>`).join('')}</div><div class="grow"></div><p class="obn" style="margin-top:14px">Si te pagan quincenal, elige el primer pago; luego agregas el otro.</p>`;
 else if(st.startsWith('cat:')){const c=d.cats.find(x=>x.id===st.slice(4));const others=sum(d.cats.filter(x=>x.id!==c.id),x=>x.budget);const rest=inc-others-v;
  b=`<div class="obring sm">${ringSvg(inc?Math.max(0,rest)/inc:0,rest<0?'var(--red)':c.color)}<b class="${rest<0?'neg':''}">${money(rest)}</b><small>restante</small></div>
  <div class="obcard"><div class="hd"><span class="ico" style="--c:${c.color}">${cIc(c)}</span><span><b>${esc(c.name)}</b><small>${c.fixed?'Monto mensual':'Presupuesto mensual'}</small></span></div>${OB.phase==='day'?`<p style="text-align:center;font-weight:800;font-size:22px;margin-top:10px;color:${c.color}">${money(c.budget)}</p><p class="obn" style="margin:6px 0 0">¿Qué día del mes se paga?</p><div class="dgrid" style="--c:${c.color}">${Array.from({length:31},(_,i)=>`<button data-a="obDay" data-d="${i+1}">${i+1}</button>`).join('')}</div>`:`<span class="obamt" style="color:${v?c.color:'var(--mute)'}">${money(v)}</span>`}</div>
  ${OB.phase==='day'?`<button class="btn soft" data-a="obSkip">Sin día fijo ${ic('right')}</button>`:`<p class="obn">${c.fixed?'Lo que pagas cada mes':'Cuánto quieres gastar como máximo al mes'}</p>${v?`<button class="btn" style="--b:${c.color}" data-a="obNext">Confirmar</button>`:`<button class="btn soft" data-a="obSkip">Más tarde ${ic('right')}</button>`}${keypad()}`}`}
 else if(st==='summary'){const cats=d.cats.filter(c=>c.budget>0);const plan=sum(cats,c=>c.budget),sv=inc-plan,tot=Math.max(inc,plan)||1;const pct=inc?Math.round(sv/inc*100):0;
  b=`<h2 class="obh">Así queda tu mes</h2><div class="donut">${donutSvg([...cats.map(c=>({v:c.budget,c:c.color})),...(sv>0?[{v:sv,c:'var(--green)'}]:[])],tot)}<div class="ctr"><small>${sv<0?'Te pasas por':'Puedes ahorrar'}</small><b class="${sv<0?'neg':'pos'}" style="font-size:26px">${money(Math.abs(sv))}</b><small>${sv<0?'':pct+'% de tu salario'}</small></div></div><div class="card oblist" style="padding:6px 14px">${cats.map(c=>`<div class="lrow"><span class="ico" style="--c:${c.color}">${cIc(c)}</span><span><b>${esc(c.name)}</b></span><span class="r"><b>${money(c.budget)}</b><small>${inc?Math.round(c.budget/inc*100):0}%</small></span></div>`).join('')||'<p class="empty small">No pusiste presupuestos. Puedes hacerlo luego.</p>'}</div><div class="grow"></div><button class="btn" data-a="obNext">¡Genial! Sigamos</button>`}
 else{b=`<h2 class="obh">¿Con qué tarjetas pagas?</h2><p class="obn">Así la app reconoce tus compras en las notificaciones y te dice con cuál conviene pagar.</p><div class="card" style="padding:14px"><label class="fld"><span>Banco o nombre</span><input class="inp" id="ob-an" placeholder="Ej: Bancolombia" autocomplete="off"></label><div class="two"><label class="fld"><span>Tipo</span><select class="inp" id="ob-at">${Object.entries(TYPES).filter(([k])=>k!=='efe').map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><label class="fld"><span>Últimos 4</span><input class="inp" id="ob-a4" inputmode="numeric" maxlength="4" placeholder="1234"></label></div><label class="fld"><span>Saldo o deuda</span><input class="inp" id="ob-ab" inputmode="numeric" data-money placeholder="$0"></label><button class="btn soft" data-a="obAcc">${ic('plus')}Agregar</button></div><div class="oblist">${d.accs.filter(a=>a.type!=='efe').map(a=>`<div class="lrow"><span class="ico" style="--c:${esc(a.color)}">${ic('card')}</span><span><b>${esc(a.name)}</b><small>${TYPES[a.type]}${a.last4?' · '+esc(a.last4):''}</small></span><span class="r"><b>${money(a.bal)}</b></span></div>`).join('')}</div><div class="grow"></div><button class="btn" data-a="obDone">${ic('check')}Terminar</button>`}
 $('#ob').innerHTML=`<div class="obw">${top}${b}</div>`}
function obAdvance(){OB.step++;OB.phase='amt';const st=OB.steps[OB.step];if(!st)return obDone();if(st.startsWith('cat:')){const c=OB.d.cats.find(x=>x.id===st.slice(4));OB.val=c.budget?String(c.budget):''}else OB.val='';renderOb()}

 txEdit:d=>txSheet(d.id,{cat:d.cat}),voice:()=>voiceAdd(),accEdit:d=>accSheet(d.id),catEdit:d=>catSheet(d.id),incEdit:d=>incSheet(d.id),billEdit:d=>billSheet(d.id),
 goalNew:()=>goalPick(),goalTpl:d=>goalSheet(null,d.k),goalEdit:d=>goalSheet(d.id),goalAdd:d=>goalAdd(d.id),loanEdit:d=>loanSheet(d.id),

 csv:async()=>{const rows=[['fecha','hora','tipo','monto','comercio','categoria','cuenta','descuento','origen']];const D=disc();for(const t of [...S.txs].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)))rows.push([t.date,t.time,t.kind==='i'?'ingreso':t.kind==='t'?'retiro':'gasto',t.amount,t.merchant,t.kind==='g'?cat(t.cat).name:'',acc(t.acc)?.name||'',D.out[t.id]?.saved||0,t.src]);const txt=rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n');
  if(PWA){dl(`bolsillo-movimientos-${todayStr()}.csv`,'\ufeff'+txt,'text/csv');push('CSV descargado',`${rows.length-1} movimientos para abrir en Excel o Sheets.`,'ok');return}
  try{await navigator.clipboard.writeText(txt);push('CSV copiado',`${rows.length-1} movimientos listos para pegar en Excel o Sheets.`,'ok')}catch(e){sheet('Copia este CSV',`<textarea class="inp" style="min-height:260px;font-size:13px" readonly>${esc(txt)}</textarea>`)}},
 backup:async()=>{const txt=JSON.stringify({app:'bolsillo',v:1,fecha:new Date().toISOString(),data:S});if(PWA){dl(`bolsillo-copia-${todayStr()}.json`,txt,'application/json');push('Copia descargada','Guárdala en Drive o en tu computador.','ok');return}
  try{await navigator.clipboard.writeText(txt);push('Copia de seguridad copiada','Pégala en la versión instalable: Configuración → Restaurar una copia.','ok')}catch(e){sheet('Copia de seguridad',`<p class="small mute" style="margin-bottom:8px">Selecciona todo el texto y cópialo.</p><textarea class="inp" style="min-height:260px;font-size:13px" readonly>${esc(txt)}</textarea>`)}},
 restore:()=>restoreSheet(),macro:()=>macroSheet(),

 copyUrl:async d=>{try{await navigator.clipboard.writeText(d.u);push('Dirección copiada','Pégala en la acción de MacroDroid.','ok')}catch(e){push('No se pudo copiar','Mantén presionada la dirección y cópiala.','warn')}},
 readN:()=>{const p=parseNotif($('#ntext')?.value);lastParsed=p;if(p&&!p.error&&!S.cfg.capture){push('La lectura está apagada','Actívala en Descuentos para registrar notificaciones.','warn')}previewN(p)},

if(PWA)pwaInit();else cloudInit();
}
